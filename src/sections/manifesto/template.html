<section class="section s-manifesto on-orange" data-section="manifesto" id="manifesto" aria-labelledby="manifesto-title">
  <!-- The stage: pinned for three beats. Reads as three plain statements when motion is off. -->
  <div class="s-manifesto__stage">
    <header class="s-manifesto__top">
      <div class="s-manifesto__bars" aria-hidden="true"><i><b></b></i><i><b></b></i><i><b></b></i></div>
      <p class="s-manifesto__kicker t-cap" data-kicker>WoodBaby · Goods &amp; Wares</p>
      <p class="s-manifesto__count t-cap" aria-hidden="true">
        <span class="s-manifesto__roll"><span class="s-manifesto__reel"><b>01</b><b>02</b><b>03</b></span></span>
        <span class="s-manifesto__of">/ 03</span>
      </p>
    </header>

    <h2 class="sr-only" id="manifesto-title">Bold. Loud. Classic.</h2>

    <ol class="s-manifesto__beats">
      <!-- 01: heavy. Lands on the floor of the screen. -->
      <li class="s-manifesto__beat s-manifesto__beat--bold">
        <div class="s-manifesto__drop">
          <div class="s-manifesto__squash">
            <h3 class="s-manifesto__word s-manifesto__word--bold t-display" data-word>Bold.</h3>
          </div>
        </div>
        <div class="s-manifesto__mask">
          <p class="s-manifesto__line s-manifesto__line--bold" data-line>Objects with real personality.</p>
        </div>
      </li>

      <!-- 02: a crescendo. Echo lines are added by the script; the heading is the solid one. -->
      <li class="s-manifesto__beat s-manifesto__beat--loud">
        <div class="s-manifesto__shake">
          <div class="s-manifesto__stack">
            <h3 class="s-manifesto__word s-manifesto__word--loud s-manifesto__shout t-display" data-word>Loud.</h3>
          </div>
        </div>
        <p class="s-manifesto__line s-manifesto__line--loud" data-line>Because ordinary is overrated.</p>
      </li>

      <!-- 03: quiet. One thin circle, one serif word. -->
      <li class="s-manifesto__beat s-manifesto__beat--classic">
        <div class="s-manifesto__seat">
          <svg class="s-manifesto__ring" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
            <circle cx="100" cy="100" r="99.4" fill="none" stroke="currentColor" stroke-width="1" transform="rotate(-90 100 100)" />
          </svg>
          <div class="s-manifesto__veil">
            <h3 class="s-manifesto__word s-manifesto__word--classic t-serif" data-word>Classic.</h3>
          </div>
        </div>
        <div class="s-manifesto__note">
          <i class="s-manifesto__rule" aria-hidden="true"></i>
          <div class="s-manifesto__mask">
            <p class="s-manifesto__line s-manifesto__line--classic t-cap" data-line>Made to outlast the trends.</p>
          </div>
        </div>
      </li>
    </ol>
  </div>

  <!-- One band of her phrases, running. The script rebuilds it with her badge as the separator. -->
  <div class="s-manifesto__band">
    <div class="s-manifesto__track" data-track>
      <p class="s-manifesto__set" data-set>
        <span class="s-manifesto__phrase">absurdly well made</span><i class="s-manifesto__sep" aria-hidden="true"></i>
        <span class="s-manifesto__phrase s-manifesto__phrase--serif">functional art</span><i class="s-manifesto__sep" aria-hidden="true"></i>
        <span class="s-manifesto__phrase">handmade in Nashville</span><i class="s-manifesto__sep" aria-hidden="true"></i>
        <span class="s-manifesto__phrase s-manifesto__phrase--serif">made to order</span><i class="s-manifesto__sep" aria-hidden="true"></i>
        <span class="s-manifesto__phrase">one of a kind</span><i class="s-manifesto__sep" aria-hidden="true"></i>
      </p>
    </div>
  </div>
</section>
