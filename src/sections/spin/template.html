<section class="section s-spin" data-section="spin" id="spin" aria-labelledby="spin-line">
  <div class="s-spin__stage" data-spin-stage>
    <!-- the piece number as a poster numeral; digits roll when the piece changes -->
    <div class="s-spin__num t-display" data-spin-numeral aria-hidden="true">
      <span class="s-spin__digit"><span class="s-spin__roll"><span class="s-spin__glyph">0</span></span></span><span class="s-spin__digit"><span class="s-spin__roll"><span class="s-spin__glyph">1</span></span></span>
    </div>

    <!-- the thin poster circle; the dot rides it with the turntable -->
    <div class="s-spin__ring" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none">
        <circle data-spin-circle cx="100" cy="100" r="99" transform="rotate(-90 100 100)" />
      </svg>
      <div class="s-spin__dial" data-spin-dial><i></i></div>
    </div>

    <!-- photo stand-in when there is no 3D (filled by the script) -->
    <div class="s-spin__photo" data-spin-photo hidden></div>

    <!-- the shared turntable canvas mounts here -->
    <div class="s-spin__host" data-spin-host role="group" aria-label="The piece on a turntable. Drag sideways, or use the left and right arrow keys, to rotate it."></div>

    <h2 class="s-spin__line t-display" id="spin-line" data-spin-line>Now spin it.</h2>

    <p class="s-spin__cap s-spin__cap--tl t-cap">
      <span class="s-spin__mask"><span data-spin-count>Nº 01 / 17</span></span>
    </p>
    <p class="s-spin__cap s-spin__cap--tr t-cap">
      <span class="s-spin__mask"><span data-spin-room>Home + Furniture</span></span>
    </p>

    <div class="s-spin__tags">
      <p class="sticker s-spin__price" data-spin-price>$450</p>
      <p class="s-spin__badge t-cap" data-spin-badge>One of one</p>
    </div>

    <p class="s-spin__hint t-cap" data-spin-hint>
      <span class="s-spin__hand" data-spin-hand aria-hidden="true">
        <svg viewBox="0 0 30 34">
          <rect x="10" y="1" width="7" height="19" rx="3.5" />
          <rect x="16.4" y="10.5" width="5.6" height="10" rx="2.8" />
          <rect x="21.4" y="12" width="5.6" height="10" rx="2.8" />
          <rect x="2.4" y="15.5" width="6.4" height="12" rx="3.2" transform="rotate(-32 5.6 21.5)" />
          <rect x="9" y="15" width="18" height="17" rx="7.5" />
        </svg>
      </span>
      <span class="s-spin__mask"><span data-spin-hint-text>Drag to rotate</span></span>
    </p>

    <div class="s-spin__nav" data-spin-nav>
      <button class="s-spin__arrow" type="button" data-spin-prev aria-label="Previous piece"><span aria-hidden="true">←</span></button>
      <button class="s-spin__arrow" type="button" data-spin-next aria-label="Next piece"><span aria-hidden="true">→</span></button>
    </div>
  </div>

  <div class="s-spin__info">
    <p class="s-spin__kicker t-serif" data-spin-kicker><span>Old technique, quiet drama.</span></p>
    <h3 class="s-spin__title t-h1" data-spin-title>
      <span class="s-spin__tline"><span>Yakisugi</span></span>
      <span class="s-spin__tline"><span>Crane Stool</span></span>
    </h3>
    <div class="s-spin__woods" data-spin-woods role="group" aria-label="Wood">
      <span class="s-spin__swatches" data-spin-swatches>
        <button class="s-spin__swatch" type="button" style="--sw: #1f1a17" aria-pressed="true" aria-label="Yakisugi"></button>
      </span>
      <span class="s-spin__wood t-cap"><span class="s-spin__mask"><span data-spin-wood>Yakisugi</span></span></span>
    </div>
    <div class="s-spin__actions" data-spin-actions>
      <button class="btn" type="button" data-spin-view>View piece <span class="btn__arrow">→</span></button>
      <a class="btn btn--ghost" data-spin-shop href="https://woodbabybuilds.com/products/yakisugi-crane-wooden-stool" target="_blank" rel="noopener">Shop <span class="btn__arrow">↗</span></a>
    </div>
  </div>

  <nav class="s-spin__rail" data-spin-rail aria-label="Pieces on the turntable">
    <div class="s-spin__track" data-spin-track></div>
  </nav>
</section>
