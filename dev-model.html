<!doctype html>
<!-- Dev harness for one 3D model. Not part of the production build.
     /dev-model.html?m=<handle>&wood=<species>&yaw=<rad>&pitch=<rad>&zoom=1&bg=cream|ink|orange|paper&auto=0&mode=turntable|free&refs=1
     window.__stage is the stage instance; window.__ready resolves when the model is on screen. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Model harness</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: grid; grid-template-rows: 1fr auto; font: 12px/1.3 ui-monospace, monospace; }
      #host { position: relative; min-height: 0; }
      #refs { display: flex; gap: 4px; padding: 4px; overflow-x: auto; background: #0002; }
      #refs img { height: 150px; border-radius: 6px; }
      [hidden] { display: none !important; }
      #hud { position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px; background: #0008; color: #fff; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="refs" hidden></div>
    <div id="hud"></div>
    <script type="module">
      import './src/styles/tokens.css';
      import { createStage } from './src/three/stage.js';
      import { productByHandle } from './src/data/index.js';
      import { src } from './src/lib/media.js';

      const q = new URLSearchParams(location.search);
      const handle = q.get('m') || 'the-butterfly-board';
      const BG = { cream: '#ece7d8', ink: '#16130f', orange: '#e0722c', paper: '#f4efe2', white: '#ffffff' };
      document.body.style.background = BG[q.get('bg')] || BG.cream;
      const p = productByHandle[handle];
      const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);

      const stage = createStage({ autoRotate: q.get('auto') === '1' });
      stage.mount(document.getElementById('host'), { mode: q.get('mode') || 'turntable' });
      window.__stage = stage;
      window.__ready = stage
        .show(handle, { wood: q.get('wood') || p?.woods?.[0], immediate: true, view: { ...(q.has('yaw') ? { yaw: num('yaw') } : {}), ...(q.has('pitch') ? { pitch: num('pitch') } : {}), ...(q.has('zoom') ? { zoom: num('zoom') } : {}) } })
        .then(() => new Promise((r) => setTimeout(r, 400)))
        .then(() => {
          stage.render();
          let tris = 0, meshes = 0;
          const mats = new Set();
          stage.state.model.traverse((o) => {
            if (!o.isMesh) return;
            meshes += 1;
            tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
            [].concat(o.material).forEach((m) => mats.add(m));
          });
          window.__stats = { triangles: Math.round(tris), meshes, materials: mats.size, radiusM: +stage.state.radius.toFixed(3), heightM: +stage.state.height.toFixed(3) };
          document.getElementById('hud').textContent = `${handle} · r=${stage.state.radius.toFixed(3)}m h=${stage.state.height.toFixed(3)}m`;
          document.documentElement.dataset.ready = '1';
        });

      if (q.get('refs') === '1' && p) {
        const refs = document.getElementById('refs');
        refs.hidden = false;
        refs.innerHTML = p.images.map((m) => `<img src="${src(m, 600)}">`).join('');
      }
      if (q.get('hud') === '0') document.getElementById('hud').hidden = true;
    </script>
  </body>
</html>
